  #   - uses: ./.github/actions/setup-python-uv
  #     with:
  #       python-version: ${{ env.PYTHON_VERSION }}
  #   - name: Build distributions
  #     run: uv run --locked --extra dev tox run -e build
  #   - name: Publish
