name: Docker

# CI paused 2026-11-08 (GitHub Actions billing lock). Revert this commit
# to restore the original triggers.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker image
      run: docker build --pull -t python-template:ci .
    - name: Smoke-test Docker image
      run: docker run --rm python-template:ci uv run python -c "import project_name"
