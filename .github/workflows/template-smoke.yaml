name: Template Smoke

# CI paused 2026-11-08 (GitHub Actions billing lock). Revert this commit
# to restore the original triggers.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  generated-project:
    name: Generated project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-python-uv
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Run generated-project smoke test
      run: uv run --locked --extra dev --extra docs tox run -e template
