version: 2
updates:
# The `uv` ecosystem understands pyproject.toml *and* uv.lock. The `pip`
# ecosystem does not update uv.lock, so transitive pins there (which CI
# installs, because every job runs with --locked) would never be bumped.
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Rome
  open-pull-requests-limit: 10
  commit-message:
    prefix: build
    include: scope
  groups:
    python-dependencies:
      patterns:
      - '*'

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:30
    timezone: Europe/Rome
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci
    include: scope
  groups:
    github-actions:
      patterns:
      - '*'

- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 07:00
    timezone: Europe/Rome
  open-pull-requests-limit: 5
  commit-message:
    prefix: build
    include: scope
  groups:
    docker-images:
      patterns:
      - '*'
