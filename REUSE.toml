version = 1

[[annotations]]
path = [
    ".claude/**",
    ".devcontainer/**",
    ".env",
    ".github/**",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".pylintrc",
    ".readthedocs.yaml",
    "AGENTS.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "Dockerfile",
